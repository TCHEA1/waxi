# Fabrique automatiquement l'APK de Waxi à chaque envoi sur GitHub.
# Le fichier se télécharge dans l'onglet "Actions" > dernière exécution > "Artifacts".
name: Fabriquer l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Copier le jeu dans le projet Android
        run: npm run sync

      - name: Fabriquer l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk waxi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: waxi-apk
          path: waxi.apk

      # Page de téléchargement directe : github.com/TCHEA1/waxi/releases/latest
      - name: Publier l'APK au téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Waxi (test) n°${{ github.run_number }}
          body: APK de test de Waxi. Télécharge waxi.apk et ouvre-le sur ton téléphone Android.
          files: waxi.apk
          make_latest: true
