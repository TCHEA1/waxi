# Fabrique automatiquement l'APK de Waxi à chaque envoi sur GitHub.
# Le fichier se télécharge dans l'onglet "Actions" > dernière exécution > "Artifacts".
name: Fabriquer l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Copier le jeu dans le projet Android
        run: npm run sync

      - name: Fabriquer l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk waxi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: waxi-apk
          path: waxi.apk
